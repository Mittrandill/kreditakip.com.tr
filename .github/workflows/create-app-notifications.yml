name: Scheduled Notifications & Renewals

on:
  schedule:
    # Her gün 09:00 ve 18:00 UTC'de çalış (12:00 ve 21:00 Türkiye saati)
    - cron: '0 9 * * *'
    - cron: '0 18 * * *'
    # Her gün 10:00 UTC'de çalış (13:00 Türkiye saati) - Renewal notifications
    - cron: '0 10 * * *'
  workflow_dispatch: # Manuel tetikleme için

jobs:
  create-notifications:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Create App Notifications
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
        MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://kreditakip.com.tr' }}
      run: |
        echo "📂 Current working directory: $(pwd)"
        echo "📋 Listing scripts directory:"
        ls -la scripts/
        echo "🔍 Verifying script file exists:"
        if [ -f "scripts/create-app-notifications.js" ]; then
          echo "✅ Script file found"
        else
          echo "❌ Script file not found"
          exit 1
        fi
        echo "🚀 Running app notification script..."
        node scripts/create-app-notifications.js

    - name: Workflow Summary
      if: always()
      run: |
        echo "📊 App Notification Workflow Summary"
        echo "======================================"
        echo "Workflow completed at: $(date)"

  renewal-notifications:
    runs-on: ubuntu-latest
    # Sadece 10:00 UTC'de çalışsın (13:00 TR - yenileme bildirimleri için)
    if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Send Renewal Notifications
      env:
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://kreditakip.com.tr' }}
      run: |
        echo "🔔 Sending renewal notifications..."
        if [ -z "${CRON_SECRET}" ]; then
          echo "❌ CRON_SECRET is not set!"
          exit 1
        fi
        echo "✓ CRON_SECRET is set (length: ${#CRON_SECRET})"

        # First, check where the URL redirects to
        echo "🔍 Checking redirect location..."
        curl -I -X POST "${NEXT_PUBLIC_SITE_URL}/api/cron/renewal-notification" 2>&1 | grep -i "location:" || true

        echo ""
        echo "📡 Sending request with both headers and following redirects..."
        response=$(curl -s -w "\n%{http_code}" -L -X POST \
          -H "Authorization: Bearer ${CRON_SECRET}" \
          -H "X-Cron-Secret: ${CRON_SECRET}" \
          -H "Content-Type: application/json" \
          "${NEXT_PUBLIC_SITE_URL}/api/cron/renewal-notification")

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | head -n-1)

        echo "📊 Response status: $http_code"
        echo "📝 Response body: $body"

        if [ "$http_code" -ne 200 ]; then
          echo "❌ Renewal notification failed with status $http_code"
          exit 1
        fi

        echo "✅ Renewal notifications sent successfully"

    - name: Workflow Summary
      if: always()
      run: |
        echo "📊 Renewal Notification Workflow Summary"
        echo "=========================================="
        echo "Workflow completed at: $(date)"
