name: Monthly Payment Summary Email

on:
  schedule:
    # Run on the 1st of every month at 09:00 UTC (12:00 Turkey time)
    - cron: '0 9 1 * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-monthly-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Send Monthly Payment Summary Emails
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
        run: |
          echo "📂 Current working directory: $(pwd)"
          echo "📋 Listing scripts directory:"
          ls -la scripts/
          echo "🔍 Verifying script file exists:"
          if [ -f "scripts/send-monthly-payment-summary.js" ]; then
            echo "✅ Script file found"
          else
            echo "❌ Script file not found"
            exit 1
          fi
          echo "🚀 Running monthly payment summary script..."
          node scripts/send-monthly-payment-summary.js

      - name: Workflow Summary
        if: always()
        run: |
          echo "📊 Monthly Payment Summary Workflow"
          echo "====================================="
          echo "Workflow completed at: $(date)"
