          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "📊 Response status: $http_code"
          echo "📝 Response body: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "❌ Renewal notification failed with status $http_code"
            exit 1
          fi

          echo "✅ Renewal notifications sent successfully"

  expiry-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check Expired Subscriptions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://kreditakip.com.tr' }}
        run: |
          echo "⏰ Checking expired subscriptions..."

          response=$(curl -s -w "\n%{http_code}" -L -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${NEXT_PUBLIC_SITE_URL}/api/cron/subscription-expiry-check")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "📊 Response status: $http_code"
          echo "📝 Response body: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "❌ Expiry check failed with status $http_code"
            exit 1
          fi

          echo "✅ Expiry check completed successfully"

  grace-period:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Handle Grace Period
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://kreditakip.com.tr' }}
        run: |
          echo "🚨 Handling grace period..."

          response=$(curl -s -w "\n%{http_code}" -L -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${NEXT_PUBLIC_SITE_URL}/api/cron/grace-period-handler")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "📊 Response status: $http_code"
          echo "📝 Response body: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "❌ Grace period handler failed with status $http_code"
            exit 1
          fi

          echo "✅ Grace period handled successfully"
